services:
  # SQL Server Database
  melsql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: meltransport_db
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'YourPassword123'
      MSSQL_PID: 'Developer'
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourPassword123 -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - meltransport_network

  # .NET Core API
  meltransport-api:
    build:
      context: ./MelTransport
      dockerfile: Dockerfile
    container_name: meltransport_api
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false
      ConnectionStrings__DefaultConnection: 'Server=melsql,1433;Database=MelTransportSystem;User Id=sa;Password=YourPassword123;TrustServerCertificate=True;MultipleActiveResultSets=true'
    ports:
      - "5000:5000"
    depends_on:
      melsql:
        condition: service_healthy   # Wait until SQL Server is healthy
    networks:
      - meltransport_network

  # React Frontend (Vite)
  meltransport-app:
    build:
      context: ./meltransport-app
      dockerfile: Dockerfile
    container_name: meltransport_frontend
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - meltransport-api
    networks:
      - meltransport_network

volumes:
  sqlserver_data:
    driver: local

networks:
  meltransport_network:
    driver: bridge
